<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Calculadora de Temporada — rendimento Airbnb | Praia Digital</title><meta name="description" content="Calcule o rendimento anual de locação de temporada no litoral paulista: diária, ocupação, taxas e lucro líquido."><link rel="canonical" href="https://praia.digital/calculadora-temporada/"><style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f8fafc;color:#0f172a;line-height:1.6}.hero{background:linear-gradient(135deg,#0c4a6e,#0ea5e9);color:#fff;padding:60px 20px;text-align:center}.container{max-width:780px;margin:auto;padding:30px 20px}.card{background:#fff;border-radius:13px;padding:24px;margin-bottom:16px;box-shadow:0 3px 10px #0001}label{display:block;font-weight:600;margin:12px 0 4px}input{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;box-sizing:border-box}button{background:#0ea5e9;color:#fff;border:0;padding:14px 28px;border-radius:10px;font-size:1.1rem;font-weight:700;cursor:pointer;width:100%;margin-top:16px}.result{text-align:center}.big{font-size:2.2rem;font-weight:800;color:#0ea5e9}a.app{color:#0c4a6e;font-weight:600}footer{text-align:center;padding:24px;color:#64748b}</style></head><body><header class="hero"><h1>🧮 Calculadora de Temporada</h1><p>Quanto seu imóvel rende no Airbnb por ano? Descubra o lucro líquido real.</p></header><main class="container"><div class="card"><label>Diária média (R$)</label><input id="diaria" type="number" value="450"><label>Ocupação média (%)</label><input id="ocup" type="number" value="55"><label>Taxa da plataforma + gestão (%)</label><input id="taxa" type="number" value="18"><label>Custos mensais fixos (R$ — condomínio, IPTU, limpeza extra)</label><input id="custos" type="number" value="1200"><label>Valor do imóvel (R$, para yield)</label><input id="valor" type="number" value="600000"><button onclick="calc()">Calcular rendimento</button></div><div class="card result" id="out" style="display:none"></div><div class="card"><strong>Compare e otimize:</strong><br>💸 <a class="app" href="https://praia.digital/preco-justo/">Preço Justo</a> — sua diária está certa?<br>🌊 <a class="app" href="https://praia.digital/marea/">Maréa</a> — ocupação real por mês<br>📈 <a class="app" href="https://praia.digital/simulador-roi/">Simulador ROI</a> — cenários completos</div></main><footer><a class="app" href="https://praia.digital/apps/">🌐 Apps Praia Digital</a> · <a class="app" href="https://praia.digital/">praia.digital</a></footer><script>function calc(){var dia=+document.getElementById('diaria').value,oc=+document.getElementById('ocup').value/100,tx=+document.getElementById('taxa').value/100,cu=+document.getElementById('custos').value,v=+document.getElementById('valor').value;var bruto=dia*365*oc;var liq=bruto*(1-tx)-cu*12;var yield=(liq/v*100);document.getElementById('out').style.display='block';document.getElementById('out').innerHTML='<p>Receita bruta anual: <strong>R$ '+bruto.toLocaleString('pt-BR',{maximumFractionDigits:0})+'</strong></p><div class="big">R$ '+liq.toLocaleString('pt-BR',{maximumFractionDigits:0})+'</div><p>lucro líquido/ano</p><p>Yield bruto sobre o imóvel: <strong>'+yield.toFixed(1)+'% a.a.</strong> '+(yield>7?'🏆 Excelente!':yield>5?'✅ Bom':'⚠️ Considere otimizar preço/ocupação')+'</p>';}</script></body></html>
